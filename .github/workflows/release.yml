name: Release

# Push a tag like v1.0.0 to build InlineProfessionGuides-v1.0.0.zip and attach it to a GitHub release.
# The tag must match "## Version:" in InlineProfessionGuides.toc (v1.0.0 <-> 1.0.0), otherwise the run fails.
# "Run workflow" on the Actions tab builds the zip as a downloadable artifact without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Check tag matches TOC version
        if: github.ref_type == 'tag'
        run: |
          TOC_VERSION=$(sed -n 's/^## Version: *//p' InlineProfessionGuides/InlineProfessionGuides.toc | tr -d '\r')
          if [ "v${TOC_VERSION}" != "${VERSION}" ]; then
            echo "::error::Tag ${VERSION} does not match '## Version: ${TOC_VERSION}' in the TOC. Bump the TOC, commit, and re-tag."
            exit 1
          fi

      - name: Zip addon folder
        run: zip -r "InlineProfessionGuides-${VERSION}.zip" InlineProfessionGuides -x "*.DS_Store" "*Thumbs.db"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: InlineProfessionGuides-${{ env.VERSION }}
          path: InlineProfessionGuides-${{ env.VERSION }}.zip

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${VERSION}" "InlineProfessionGuides-${VERSION}.zip" --title "${VERSION}" --generate-notes
